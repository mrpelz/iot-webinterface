server {
  listen 1338 default_server;
  listen [::]:1338 default_server;

  add_header access-control-allow-credentials "true";
  add_header access-control-allow-headers "Origin,Content-Type,Accept";
  add_header access-control-allow-origin "*";
  add_header cache-control "no-cache";
  add_header service-worker-allowed / always;
  add_header x-request-time $date_gmt;

  expires off;
  root /usr/share/nginx/html;

  # serve `/` with file `/index.html`
  location = / {
    index index.html;
  }

  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok";
  }

  location = /__proxy-api-hostname {
    add_header Content-Type text/plain;
    return 200 "{IOT_MONOLITH_HOSTNAME}\n(using schema {IOT_MONOLITH_SCHEMA})";
  }

  location = /__package-spec {
    add_header Content-Type text/plain;
    return 200 "{PACKAGE_SPEC}";
  }

  # for simple routes not pointing to files, fall back to serving `/index.html`
  location / {
    try_files $uri $uri/ /index.html;
  }

  # proxy api stream-endpoint with websocket-specific proxy settings
  # disallow storage completely
  location = /api/stream {
    add_header cache-control "no-store";

    rewrite .* /api/stream break;

    proxy_pass {IOT_MONOLITH_SCHEMA}://{IOT_MONOLITH_HOSTNAME};
    proxy_http_version 1.1;
    proxy_set_header upgrade $http_upgrade;
    proxy_set_header connection "Upgrade";
    proxy_set_header host "{IOT_MONOLITH_HOSTNAME}";
  }

  # iot-monolith version
  location = /api/version {
    rewrite .* /version break;

    proxy_pass {IOT_MONOLITH_SCHEMA}://{IOT_MONOLITH_HOSTNAME};
    proxy_set_header host "{IOT_MONOLITH_HOSTNAME}";
  }

  # iot-monolith log
  location = /api/log {
    rewrite .* /log break;

    proxy_pass {IOT_MONOLITH_SCHEMA}://{IOT_MONOLITH_HOSTNAME};
    proxy_set_header host "{IOT_MONOLITH_HOSTNAME}";
  }

  # iot-monolith logic-reasoning
  location = /api/logic-reasoning {
    rewrite .* /logic-reasoning break;

    proxy_pass {IOT_MONOLITH_SCHEMA}://{IOT_MONOLITH_HOSTNAME};
    proxy_set_header host "{IOT_MONOLITH_HOSTNAME}";
  }

  # proxy api
  location /api/ {
    rewrite ^/api(.*) /api$1 break;

    proxy_pass {IOT_MONOLITH_SCHEMA}://{IOT_MONOLITH_HOSTNAME};
    proxy_set_header host "{IOT_MONOLITH_HOSTNAME}";
  }
}
